<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Database Studio | Helpdesk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0c101d;
      --bg-sidebar: #0f1527;
      --bg-card: #151d33;
      --bg-input: #0a0e1a;
      --border-color: rgba(255, 255, 255, 0.08);
      --border-focus: #6366f1;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent-green: #10b981;
      --accent-green-bg: rgba(16, 185, 129, 0.15);
      --code-color: #34d399;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Navigation Header */
    .top-header {
      background-color: var(--bg-sidebar);
      border-bottom: 1px solid var(--border-color);
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      flex-shrink: 0;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
      font-size: 1.25rem;
    }

    .brand-title-wrap h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #fff;
    }

    .brand-title-wrap p {
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-top: 2px;
      font-family: 'JetBrains Mono', monospace;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .connected-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      background: var(--accent-green-bg);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--accent-green);
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .connected-dot {
      width: 7px;
      height: 7px;
      background-color: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--accent-green);
    }

    .open-app-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #f1f5f9;
      padding: 7px 14px;
      border-radius: 9px;
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .open-app-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    /* Main Container with Sidebar + Content */
    .studio-layout {
      display: flex;
      flex: 1;
      height: calc(100vh - 64px);
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 250px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 12px;
      flex-shrink: 0;
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 10px;
      color: var(--text-muted);
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: left;
    }

    .nav-item-btn:hover {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-main);
    }

    .nav-item-btn.active {
      background: rgba(99, 102, 241, 0.15);
      border-color: rgba(99, 102, 241, 0.35);
      color: #fff;
    }

    .nav-item-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .count-badge {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-dim);
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 0.725rem;
      font-family: 'JetBrains Mono', monospace;
    }

    .nav-item-btn.active .count-badge {
      background: rgba(99, 102, 241, 0.3);
      color: #c7d2fe;
    }

    .sidebar-footer {
      border-top: 1px solid var(--border-color);
      padding-top: 14px;
    }

    .query-runner-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 10px;
      color: #c7d2fe;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .query-runner-btn:hover,
    .query-runner-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
    }

    /* Content Area */
    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px 32px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Console View */
    .console-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
      height: 100%;
    }

    .panel-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .panel-header-title {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .sample-buttons {
      display: flex;
      gap: 8px;
    }

    .sample-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.775rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .sample-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.15);
    }

    .sql-editor-container {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.4);
    }

    .sql-textarea {
      width: 100%;
      height: 110px;
      background: transparent;
      border: none;
      outline: none;
      color: #38bdf8;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      line-height: 1.6;
      resize: vertical;
    }

    .action-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .run-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 10px 22px;
      border-radius: 9px;
      font-size: 0.875rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
      transition: all 0.2s ease;
    }

    .run-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .status-msg {
      font-size: 0.85rem;
      font-weight: 600;
    }

    .status-success {
      color: #34d399;
    }

    .status-error {
      color: #f87171;
    }

    /* Output Container */
    .output-container {
      flex: 1;
      background: #080c18;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      overflow-y: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.875rem;
      line-height: 1.65;
      color: var(--code-color);
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.5);
      white-space: pre-wrap;
      max-height: 480px;
    }

    /* Table View */
    .table-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
      height: 100%;
    }

    .table-container {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: auto;
      flex: 1;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.85rem;
    }

    th {
      background: #0e1424;
      padding: 12px 16px;
      font-weight: 700;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 10;
      white-space: nowrap;
    }

    td {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      color: var(--text-main);
      white-space: nowrap;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="top-header">
    <div class="brand-section">
      <div class="brand-icon">📦</div>
      <div class="brand-title-wrap">
        <h1>Helpdesk Database Studio</h1>
        <p>PostgreSQL @ 127.0.0.1:5432 • Database: helpdesk</p>
      </div>
    </div>
    <div class="header-actions">
      <div class="connected-pill">
        <span class="connected-dot"></span>
        <span>Connected</span>
      </div>
      <a href="http://localhost:5173" target="_blank" class="open-app-btn">
        <span>🚀 Open App (5173) &rarr;</span>
      </a>
    </div>
  </header>

  <!-- Studio Layout -->
  <div class="studio-layout">
    <!-- Left Navigation Sidebar -->
    <aside class="sidebar">
      <ul class="nav-list">
        <li>
          <button class="nav-item-btn" onclick="selectTable('ticket')">
            <span class="nav-item-left">🎫 Tickets</span>
            <span class="count-badge" id="badge-ticket">-</span>
          </button>
        </li>
        <li>
          <button class="nav-item-btn" onclick="selectTable('user')">
            <span class="nav-item-left">👥 Users</span>
            <span class="count-badge" id="badge-user">-</span>
          </button>
        </li>
        <li>
          <button class="nav-item-btn" onclick="selectTable('reply')">
            <span class="nav-item-left">💬 Replies</span>
            <span class="count-badge" id="badge-reply">-</span>
          </button>
        </li>
        <li>
          <button class="nav-item-btn" onclick="selectTable('session')">
            <span class="nav-item-left">🔑 Sessions</span>
            <span class="count-badge" id="badge-session">-</span>
          </button>
        </li>
        <li>
          <button class="nav-item-btn" onclick="selectTable('account')">
            <span class="nav-item-left">🛡️ Accounts</span>
            <span class="count-badge" id="badge-account">-</span>
          </button>
        </li>
      </ul>

      <div class="sidebar-footer">
        <button class="query-runner-btn active" onclick="selectConsole()">
          <span>⚡</span>
          <span>SQL Query Runner</span>
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="content-area">

      <!-- 1. Console View (SQL Query Runner) -->
      <section id="console-view" class="console-panel">
        <div class="panel-header-row">
          <span class="panel-header-title">Execute Custom SQL Query</span>
          <div class="sample-buttons">
            <button class="sample-btn" onclick="setQuery('SELECT * FROM ticket LIMIT 5;')">Sample Ticket Query</button>
            <button class="sample-btn" onclick="setQuery('SELECT * FROM public.user LIMIT 5;')">Sample Users Query</button>
            <button class="sample-btn" onclick="setQuery('SELECT * FROM reply LIMIT 5;')">Sample Replies Query</button>
          </div>
        </div>

        <div class="sql-editor-container">
          <textarea id="sql-input" class="sql-textarea" spellcheck="false">SELECT * FROM ticket LIMIT 5;</textarea>
        </div>

        <div class="action-row">
          <button class="run-btn" onclick="runCustomQuery()">
            <span>▶</span>
            <span>Run Query</span>
          </button>
          <span id="query-status" class="status-msg status-success">Ready</span>
        </div>

        <pre id="output-box" class="output-container">// Query results will appear here...</pre>
      </section>

      <!-- 2. Table Data View -->
      <section id="table-view" class="table-panel" style="display: none;">
        <div class="panel-header-row">
          <span class="panel-header-title" id="table-header-title">Table Data</span>
          <button class="sample-btn" onclick="reloadCurrentTable()">↻ Refresh</button>
        </div>
        <div class="table-container">
          <table id="data-table">
            <thead id="data-thead"></thead>
            <tbody id="data-tbody"></tbody>
          </table>
        </div>
      </section>

    </main>
  </div>

  <script>
    let currentTable = null;

    // Load table counts from server
    async function fetchStats() {
      try {
        const res = await fetch('/api/stats');
        const data = await res.json();
        if (data.counts) {
          document.getElementById('badge-ticket').textContent = data.counts.ticket;
          document.getElementById('badge-user').textContent = data.counts.user;
          document.getElementById('badge-reply').textContent = data.counts.reply;
          document.getElementById('badge-session').textContent = data.counts.session;
          document.getElementById('badge-account').textContent = data.counts.account;
        }
      } catch (err) {
        console.error('Failed to load stats:', err);
      }
    }

    function setQuery(sql) {
      document.getElementById('sql-input').value = sql;
      runCustomQuery();
    }

    function selectConsole() {
      document.getElementById('console-view').style.display = 'flex';
      document.getElementById('table-view').style.display = 'none';

      document.querySelectorAll('.nav-item-btn').forEach(b => b.classList.remove('active'));
      document.querySelector('.query-runner-btn').classList.add('active');
    }

    async function selectTable(name) {
      currentTable = name;
      document.getElementById('console-view').style.display = 'none';
      document.getElementById('table-view').style.display = 'flex';

      document.querySelectorAll('.nav-item-btn').forEach(b => b.classList.remove('active'));
      document.querySelector('.query-runner-btn').classList.remove('active');
      event.currentTarget.classList.add('active');

      document.getElementById('table-header-title').textContent = `TABLE: ${name.toUpperCase()} (Top 100 rows)`;
      loadTableData(name);
    }

    async function loadTableData(name) {
      const thead = document.getElementById('data-thead');
      const tbody = document.getElementById('data-tbody');
      thead.innerHTML = '<tr><th>Loading...</th></tr>';
      tbody.innerHTML = '';

      try {
        const res = await fetch(`/api/table/${name}`);
        const data = await res.json();

        if (data.rows && data.rows.length > 0) {
          const fields = data.fields;
          thead.innerHTML = `<tr>${fields.map(f => `<th>${f}</th>`).join('')}</tr>`;
          tbody.innerHTML = data.rows.map(row => `
            <tr>${fields.map(f => `<td>${row[f] !== null ? escapeHtml(String(row[f])) : '<span style="color:#64748b">null</span>'}</td>`).join('')}</tr>
          `).join('');
        } else {
          thead.innerHTML = '<tr><th>Status</th></tr>';
          tbody.innerHTML = '<tr><td>No records found in this table.</td></tr>';
        }
      } catch (err) {
        thead.innerHTML = '<tr><th>Error</th></tr>';
        tbody.innerHTML = `<tr><td>${err.message}</td></tr>`;
      }
    }

    function reloadCurrentTable() {
      if (currentTable) loadTableData(currentTable);
    }

    async function runCustomQuery() {
      const sql = document.getElementById('sql-input').value.trim();
      const statusEl = document.getElementById('query-status');
      const outputEl = document.getElementById('output-box');

      statusEl.textContent = 'Running query...';
      statusEl.className = 'status-msg';

      try {
        const res = await fetch('/api/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sql })
        });
        const data = await res.json();

        if (data.success) {
          statusEl.textContent = `✅ Success (${data.rowCount} rows returned in ${data.durationMs}ms)`;
          statusEl.className = 'status-msg status-success';
          outputEl.textContent = JSON.stringify(data.rows, null, 2);
          fetchStats(); // update counters
        } else {
          statusEl.textContent = `❌ Error: ${data.error}`;
          statusEl.className = 'status-msg status-error';
          outputEl.textContent = `Error: ${data.error}`;
        }
      } catch (err) {
        statusEl.textContent = `❌ Network Error`;
        statusEl.className = 'status-msg status-error';
        outputEl.textContent = String(err);
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Initialize
    fetchStats();
    runCustomQuery();
  </script>
</body>
</html>
